<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ortho-K 鏡片幾何工程分析儀</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: #131c2e;
      --card-bg-inner: #080d16;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --border: #1e293b;
      --cornea-color: #ffffff; 
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      height: 100vh;
      height: 100dvh; 
      overflow: hidden; 
      display: flex;
      justify-content: center;
    }
    .app-container {
      width: 100%;
      max-width: 520px;
      height: 100%;
      display: flex;
      flex-direction: column;
    }
    .fixed-top-section {
      flex-shrink: 0;
      padding: 10px 10px 0 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background-color: var(--bg-color);
      z-index: 10;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
    }
    header {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 14px;
      text-align: center;
    }
    h1 { font-size: 1.05rem; color: var(--accent); font-weight: 700; letter-spacing: 0.5px; }
    
    .chart-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px;
    }
    /* 稍微加大畫布高度，讓視覺置中的上下空間更充裕 */
    .chart-wrapper { position: relative; width: 100%; height: 260px; }
    
    /* 新增：圖表顯示控制項樣式 */
    .visibility-controls {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 8px;
      font-size: 0.85rem;
    }
    .toggle-label {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      user-select: none;
    }
    .toggle-label input[type="checkbox"] {
      cursor: pointer;
      width: 16px;
      height: 16px;
      accent-color: var(--accent);
    }

    .scrollable-bottom-section {
      flex-grow: 1;
      overflow-y: auto; 
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      -webkit-overflow-scrolling: touch; 
    }
    
    .panel {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .panel-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--accent);
      border-bottom: 1px solid var(--border);
      padding-bottom: 6px;
      margin-bottom: 4px;
    }
    .control-group { display: flex; flex-direction: column; gap: 6px; }
    .label-row { display: flex; justify-content: space-between; font-size: 0.82rem; }
    .val-highlight {
      font-weight: 700;
      color: var(--text-main);
      font-family: ui-monospace, SFMono-Regular, monospace;
    }
    input[type=range] {
      width: 100%; height: 24px; background: transparent; outline: none; accent-color: var(--accent); cursor: pointer;
    }
    input[type=number] {
      background: var(--card-bg-inner);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 4px 8px;
      border-radius: 6px;
      width: 70px;
      text-align: center;
      font-family: ui-monospace, SFMono-Regular, monospace;
    }
    
    .btn-auto {
      background: var(--accent);
      color: #000;
      border: none;
      border-radius: 8px;
      padding: 10px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-auto:hover { background: var(--accent-hover); color: #fff; }
  </style>
</head>
<body>
<div class="app-container">
  
  <div class="fixed-top-section">
    <header>
      <h1>Ortho-K 鏡片幾何工程分析儀</h1>
    </header>
    <div class="chart-card">
      <div class="chart-wrapper">
        <canvas id="simChart"></canvas>
      </div>
      <!-- 新增：角膜與鏡片顯示控制區塊 -->
      <div class="visibility-controls">
        <label class="toggle-label">
          <input type="checkbox" id="showCornea" checked> 
          <span style="color: var(--cornea-color);">角膜 (Cornea)</span>
        </label>
        <label class="toggle-label">
          <input type="checkbox" id="showLens" checked> 
          <span style="color: var(--accent);">鏡片 (Lens)</span>
        </label>
      </div>
    </div>
  </div>
  <div class="scrollable-bottom-section">
    
    <div class="panel">
      <div class="panel-title">1. 基底角膜參數 (Cornea)</div>
      <div class="control-group">
        <div class="label-row">
          <span>中央曲率 (R₀):</span>
          <span id="r0Val" class="val-highlight">7.80 mm</span>
        </div>
        <input type="range" id="r0Slider" min="7.0" max="8.5" step="0.05" value="7.80">
      </div>
      <div class="control-group">
        <div class="label-row">
          <span>離心率 (e-value):</span>
          <span id="eVal" class="val-highlight">0.50</span>
        </div>
        <input type="range" id="eSlider" min="0.0" max="0.90" step="0.01" value="0.50">
      </div>
    </div>
    <div class="panel">
      <div class="panel-title">2. 目標與自動運算 (Auto-Fit)</div>
      <div class="control-group">
        <div class="label-row">
          <span>目標降度 (Target Rx):</span>
          <span><input type="number" id="rxInput" value="3.00" step="0.25" min="1.00" max="8.00"> D</span>
        </div>
      </div>
      <div class="control-group">
        <div class="label-row">
          <span>鏡片總直徑 (OAD):</span>
          <span id="oadVal" class="val-highlight">10.6 mm</span>
        </div>
        <input type="range" id="oadSlider" min="10.0" max="11.2" step="0.1" value="10.6">
      </div>
      <button class="btn-auto" onclick="runAutoFit()">🚀 執行標準自動驗配</button>
    </div>
    <div class="panel">
      <div class="panel-title">3. 鏡片幾何微調 (Manual Override)</div>
      <div class="control-group">
        <div class="label-row">
          <span>基弧 (BC Radius):</span>
          <span id="bcVal" class="val-highlight" style="color: var(--accent);">-- mm</span>
        </div>
        <input type="range" id="bcSlider" min="7.0" max="10.0" step="0.01" value="8.50">
      </div>
      <div class="control-group">
        <div class="label-row">
          <span>反轉弧 (RC Radius):</span>
          <span id="rcVal" class="val-highlight" style="color: var(--accent);">-- mm</span>
        </div>
        <input type="range" id="rcSlider" min="5.0" max="15.0" step="0.05" value="6.50">
      </div>
      <div class="control-group">
        <div class="label-row">
          <span>定位弧 (AC Radius):</span>
          <span id="acVal" class="val-highlight" style="color: var(--accent);">-- mm</span>
        </div>
        <input type="range" id="acSlider" min="7.0" max="12.0" step="0.05" value="8.00">
      </div>
    </div>
    
    <div style="height: 30px; flex-shrink: 0;"></div>
  </div>
</div>
<script>
  /* ============================================================
     1. 數學與幾何演算法核心
     ============================================================ */
  function calculateCorneaSag(r0, e, y) {
    if (Math.abs(e) < 1e-5) return r0 - Math.sqrt(Math.max(0, r0 * r0 - y * y));
    const factor = 1 - e * e;
    const underRoot = r0 * r0 - factor * y * y;
    if (underRoot < 0) return null;
    return (r0 - Math.sqrt(underRoot)) / factor;
  }
  function getArcSagDelta(r, y_start, y_end) {
    if (r <= Math.abs(y_end)) return null; 
    const sag_start = r - Math.sqrt(r * r - y_start * y_start);
    const sag_end = r - Math.sqrt(r * r - y_end * y_end);
    return sag_end - sag_start;
  }
  function calculateLensShapeSag(rBC, rRC, rAC, oad, y_abs) {
    let sag = 0;
    const y = Math.abs(y_abs);
    const y_bc = 3.0;       
    const y_rc = 3.5;       
    const y_oad = oad / 2;  
    if (y <= y_bc) {
      let delta = getArcSagDelta(rBC, 0, y);
      if (delta === null) return null;
      sag += delta;
    } else if (y <= y_rc) {
      let d1 = getArcSagDelta(rBC, 0, y_bc);
      let d2 = getArcSagDelta(rRC, y_bc, y);
      if (d1 === null || d2 === null) return null;
      sag += d1 + d2;
    } else if (y <= y_oad) {
      let d1 = getArcSagDelta(rBC, 0, y_bc);
      let d2 = getArcSagDelta(rRC, y_bc, y_rc);
      let d3 = getArcSagDelta(rAC, y_rc, y);
      if (d1 === null || d2 === null || d3 === null) return null;
      sag += d1 + d2 + d3;
    } else {
      return null; 
    }
    return sag;
  }
  /* ============================================================
     2. DOM 與 Chart.js 初始設定
     ============================================================ */
  const r0Slider = document.getElementById('r0Slider');
  const eSlider = document.getElementById('eSlider');
  const oadSlider = document.getElementById('oadSlider');
  const bcSlider = document.getElementById('bcSlider');
  const rcSlider = document.getElementById('rcSlider');
  const acSlider = document.getElementById('acSlider');
  const rxInput = document.getElementById('rxInput');
  
  const showCorneaCheckbox = document.getElementById('showCornea');
  const showLensCheckbox = document.getElementById('showLens');
  
  const ctx = document.getElementById('simChart').getContext('2d');
  
  const chart = new Chart(ctx, {
    type: 'line',
    data: {
      datasets: [
        {
          label: '角膜 (Cornea)',
          data: [],
          borderColor: '#ffffff',
          borderWidth: 2.5,
          pointRadius: 0,
          tension: 0.1,
          zIndex: 2,
          hidden: false
        },
        {
          label: '鏡片 (Lens)',
          data: [],
          borderColor: '#38bdf8',
          borderWidth: 2.5,
          pointRadius: 0,
          tension: 0.1,
          fill: '-1', 
          backgroundColor: 'rgba(56, 189, 248, 0.25)', 
          zIndex: 1,
          hidden: false
        }
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false, animation: false,
      layout: { padding: { top: 10, bottom: 5, left: 0, right: 0 } },
      scales: {
        x: {
          type: 'linear', min: -6.0, max: 6.0,
          grid: { color: '#1e293b' },
          ticks: { color: '#94a3b8', font: { size: 9 }, stepSize: 1 }
        },
        y: {
          grid: { color: '#1e293b' },
          ticks: { color: '#94a3b8', font: { size: 9 }, callback: (v) => v.toFixed(1) },
          reverse: true 
        }
      },
      plugins: { legend: { display: false }, tooltip: { enabled: false } }
    }
  });
  /* ============================================================
     3. 核心更新邏輯 (Y軸絕對置中鎖定版)
     ============================================================ */
  function update() {
    const r0 = parseFloat(r0Slider.value);
    const e = parseFloat(eSlider.value);
    const oad = parseFloat(oadSlider.value);
    const rBC = parseFloat(bcSlider.value);
    const rRC = parseFloat(rcSlider.value);
    const rAC = parseFloat(acSlider.value);
    document.getElementById('r0Val').innerText = `${r0.toFixed(2)} mm`;
    document.getElementById('eVal').innerText = e.toFixed(2);
    document.getElementById('oadVal').innerText = `${oad.toFixed(1)} mm`;
    document.getElementById('bcVal').innerText = `${rBC.toFixed(2)} mm`;
    document.getElementById('rcVal').innerText = `${rRC.toFixed(2)} mm`;
    document.getElementById('acVal').innerText = `${rAC.toFixed(2)} mm`;
    let minDiff = 999;
    for (let y = 0.0; y <= oad / 2; y += 0.05) {
      let cs = calculateCorneaSag(r0, e, y);
      let ls = calculateLensShapeSag(rBC, rRC, rAC, oad, y);
      if (cs !== null && ls !== null) {
        let diff = cs - ls;
        if (diff < minDiff) {
          minDiff = diff;
        }
      }
    }
    let dropAmount = minDiff; 
    const pointsCornea = [];
    const pointsLens = [];
    for (let y = -5.5; y <= 5.501; y += 0.1) {
      let cs = calculateCorneaSag(r0, e, y);
      if (cs !== null) {
        pointsCornea.push({ x: y, y: cs });
      }
      
      if (Math.abs(y) <= oad / 2 + 0.01) {
        let ls = calculateLensShapeSag(rBC, rRC, rAC, oad, y);
        if (ls !== null) {
          pointsLens.push({ x: y, y: ls + dropAmount });
        } else {
          pointsLens.push({ x: y, y: null });
        }
      } else {
        pointsLens.push({ x: y, y: null });
      }
    }
    chart.data.datasets[0].data = pointsCornea;
    chart.data.datasets[1].data = pointsLens;
    // =======================================================
    // 全新框架鎖定邏輯：1:1 比例 且 垂直絕對置中
    // =======================================================
    chart.update(); 
    if (chart.chartArea) {
      const areaWidth = chart.chartArea.right - chart.chartArea.left;
      const areaHeight = chart.chartArea.bottom - chart.chartArea.top;
      
      if (areaWidth > 0 && areaHeight > 0) {
        const xSpan = 12.0; 
        const requiredYSpan = xSpan * (areaHeight / areaWidth);
        
        // 幾何絕對置中：角膜深度(0~2.5)的中心大約在 1.25mm
        const fixedCenterY = 1.25;
        
        chart.options.scales.y.min = fixedCenterY - (requiredYSpan / 2);
        chart.options.scales.y.max = fixedCenterY + (requiredYSpan / 2);
        
        chart.update(); 
      }
    }
  }
  /* ============================================================
     4. Scheme A: 自動配適演算法 (Auto-Fit)
     ============================================================ */
  function runAutoFit() {
    const r0 = parseFloat(r0Slider.value);
    const e = parseFloat(eSlider.value);
    const oad = parseFloat(oadSlider.value);
    const targetRx = parseFloat(rxInput.value);
    const jessen = 0.75; 
    const dK = 337.5 / r0;
    const targetDiopter = dK - (targetRx + jessen);
    const rBC = 337.5 / targetDiopter;
    const rAC = r0 + (e * 0.6) + 0.15; 
    let rc_low = 5.0;
    let rc_high = 15.0;
    let best_rc = 6.5;
    for (let i = 0; i < 30; i++) {
      let rc_mid = (rc_low + rc_high) / 2;
      
      let minDiff = 999;
      for (let y = 0.0; y <= oad / 2; y += 0.1) {
        let cs = calculateCorneaSag(r0, e, y);
        let ls = calculateLensShapeSag(rBC, rc_mid, rAC, oad, y);
        if (cs !== null && ls !== null) {
          if (cs - ls < minDiff) minDiff = cs - ls;
        }
      }
      
      let apical_clearance = -minDiff;
      if (apical_clearance > 0.010) {
        rc_low = rc_mid;
      } else {
        rc_high = rc_mid;
      }
      best_rc = rc_mid;
    }
    bcSlider.value = rBC.toFixed(2);
    rcSlider.value = best_rc.toFixed(2);
    acSlider.value = rAC.toFixed(2);
    update();
  }
  /* ============================================================
     5. 事件監聽與初始化
     ============================================================ */
  [r0Slider, eSlider, oadSlider, bcSlider, rcSlider, acSlider].forEach(slider => {
    slider.addEventListener('input', update);
  });
  rxInput.addEventListener('change', runAutoFit);

  // 新增：圖表顯示切換事件監聽
  showCorneaCheckbox.addEventListener('change', (e) => {
    chart.data.datasets[0].hidden = !e.target.checked;
    chart.update();
  });
  showLensCheckbox.addEventListener('change', (e) => {
    chart.data.datasets[1].hidden = !e.target.checked;
    chart.update();
  });

  let resizeTimer;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(update, 100);
  });
  runAutoFit();
</script>
</body>
</html>
